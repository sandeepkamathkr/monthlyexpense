version: '3.8'

# ==============================================================================
# Multi-Architecture Docker Compose
# ==============================================================================
# Purpose: Test registry-based multi-arch images locally
# Usage: docker-compose -f docker-compose-multiarch.yaml up
# Result: Pulls correct architecture automatically from registry
# ==============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: expense-postgres
    environment:
      POSTGRES_DB: monthly_expense_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - expense-network

  # Backend Service - Automatically pulls correct architecture
  backend-service:
    # CHANGE THIS to your registry/version
    image: sandeepkamathkr/monthly-expense-backend:1.3.1
    container_name: expense-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monthly_expense_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
    depends_on:
      - postgres
    networks:
      - expense-network
    # Platform detection happens automatically!
    # Mac M1/M2 → Gets ARM64 image
    # Windows/Linux → Gets AMD64 image

  # Frontend Service - Automatically pulls correct architecture  
  frontend:
    # CHANGE THIS to your registry/version
    image: sandeepkamathkr/monthly-expense-frontend:1.2.1
    container_name: expense-frontend
    ports:
      - "80:80"
    depends_on:
      - backend-service
    networks:
      - expense-network
    # Platform detection happens automatically!

networks:
  expense-network:
    driver: bridge

volumes:
  postgres_data:

# ==============================================================================
# HOW TO TEST AUTOMATIC ARCHITECTURE:
# ==============================================================================
# 1. Push images to registry:
#    ./push-multiarch-release.sh --backend-version 1.3.0 --frontend-version 1.2.0 --registry YOUR_USERNAME
#
# 2. Update image names above with your registry
#
# 3. Test on different platforms:
#    docker-compose -f docker-compose-multiarch.yaml pull
#    docker-compose -f docker-compose-multiarch.yaml up
#
# 4. Verify architecture:
#    docker inspect expense-backend --format "{{.Architecture}}"
#    → Shows "arm64" on Mac M1/M2
#    → Shows "amd64" on Windows/Linux
# ==============================================================================