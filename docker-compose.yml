version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: monthly-expense-frontend:latest
    ports:
      - "80:80"
    container_name: monthly-expense-frontend-app
    depends_on:
      - backend-service

  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monthly-expense-backend:latest
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    container_name: monthly-expense-backend-app
    depends_on:
      - db  # Add dependency on the database
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-monthly_expense_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-admin}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_PROFILES_ACTIVE: docker  # Activate a specific profile if needed
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost}
      CSV_INPUT_FOLDER: /app/csv-input
      CSV_DEFAULT_CURRENCY: ${CSV_DEFAULT_CURRENCY:-AUD}
      CSV_SCHEDULER_ENABLED: ${CSV_SCHEDULER_ENABLED:-true}
      CSV_SCHEDULER_INTERVAL_MS: ${CSV_SCHEDULER_INTERVAL_MS:-5000}
    volumes:
      - ${CSV_HOST_PATH:-./csv-input}:/app/csv-input

  db:
    image: postgres:17  # Use a specific version for consistency
    ports:
      - "5432:5432"  # Expose the port for debugging (optional, remove in production)
    volumes:
      - db_data:/var/lib/postgresql/data  # Persist data
    environment:
      POSTGRES_DB: ${DB_NAME:-monthly_expense_db}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}

volumes:
  db_data:  # Define the volume for PostgreSQL data
