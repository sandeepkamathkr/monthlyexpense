{{- if .Values.reprocessJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: csv-reprocess-job
  labels:
    app: csv-reprocess-job
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reprocess
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REPROCESS_ONLY
              value: "true"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/{{ .Values.global.postgresql.auth.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.global.postgresql.auth.username }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Release.Name }}-postgresql"
                  key: postgres-password
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: CSV_INPUT_FOLDER
              value: "{{ .Values.csvScheduler.inputFolder }}"
            - name: CSV_DEFAULT_CURRENCY
              value: "{{ .Values.csvScheduler.defaultCurrency }}"
          volumeMounts:
            - name: csv-input
              mountPath: /app/csv-input
      volumes:
        - name: csv-input
          {{- if .Values.csvInputVolume.persistentVolumeClaim.enabled }}
          persistentVolumeClaim:
            claimName: csv-input-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}