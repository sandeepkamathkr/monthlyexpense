name: Backend Simple CI

on:
  push:
    branches: [ main, develop, feature/add-git-workflows ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-simple.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-simple.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Cache Maven dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
        
    - name: Compile code
      run: |
        cd backend
        mvn clean compile
        
    - name: Run tests
      run: |
        cd backend
        mvn test
        
    - name: Build JAR
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: monthly-expense-jar
        path: backend/target/*.jar