name: Backend Simple CI

on:
  push:
    branches: [ main, develop, feature/add-git-workflows ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-simple.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-simple.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Build and test
      run: |
        cd backend
        mvn -B verify

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: monthly-expense-jar
        path: backend/target/*.jar