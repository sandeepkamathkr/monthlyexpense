name: Docker Build and Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: monthly-expense-backend
  FRONTEND_IMAGE: monthly-expense-frontend

jobs:
  docker-build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: Build JAR file
      run: |
        cd backend
        mvn clean package -DskipTests
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        load: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:latest
          ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        load: true
        tags: |
          ${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Test backend container
      run: |
        docker run --rm -d --name test-backend -p 8081:8081 ${{ env.BACKEND_IMAGE }}:latest
        sleep 10
        curl -f http://localhost:8081/actuator/health || exit 1
        docker stop test-backend
        echo "✅ Backend container test passed"
        
    - name: Test frontend container
      run: |
        docker run --rm -d --name test-frontend -p 8080:80 ${{ env.FRONTEND_IMAGE }}:latest
        sleep 5
        curl -f http://localhost:8080/ || exit 1
        docker stop test-frontend
        echo "✅ Frontend container test passed"
        
    - name: Test Docker Compose integration
      run: |
        # Temporarily modify docker-compose to use port 8080 to avoid conflicts
        sed -i 's/"80:80"/"8080:80"/' docker-compose.yml
        docker-compose up -d
        sleep 30
        curl -f http://localhost:8080/ || exit 1
        curl -f http://localhost:8081/actuator/health || exit 1
        docker-compose down
        echo "✅ Docker Compose integration test passed"