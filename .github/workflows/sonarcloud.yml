name: SonarCloud Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/sonarcloud.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/sonarcloud.yml'

jobs:
  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'  # SonarCloud requires Java 17+
        distribution: 'temurin'
        cache: maven
        
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
        
    - name: Run tests and generate coverage report
      run: |
        cd backend
        mvn clean verify jacoco:report
        
    - name: Run SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        cd backend
        echo "🔍 Starting SonarCloud analysis..."
        echo "Working directory: $(pwd)"
        echo "SONAR_TOKEN present: $([ -n "$SONAR_TOKEN" ] && echo "Yes" || echo "No")"
        
        # Run SonarCloud analysis with simplified approach
        mvn clean verify sonar:sonar \
          -Dsonar.projectKey=sandeepkamathkr_monthlyexpense \
          -Dsonar.organization=sandeepkamathkr \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$SONAR_TOKEN
          
        echo "✅ SonarCloud analysis completed successfully!"