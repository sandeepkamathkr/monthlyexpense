name: SonarCloud Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/sonarcloud.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/sonarcloud.yml'

jobs:
  sonarcloud:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
        
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'  # SonarCloud requires Java 17+
        distribution: 'temurin'
        cache: maven
        
    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
        
    - name: Run tests and generate coverage report
      run: |
        cd backend
        mvn clean verify jacoco:report
        
    - name: Run SonarCloud analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Automatically provided by GitHub
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # You need to add this secret
      run: |
        cd backend
        echo "🔍 Starting SonarCloud analysis..."
        echo "Working directory: $(pwd)"
        echo "SONAR_TOKEN present: $([ -n "$SONAR_TOKEN" ] && echo "Yes" || echo "No")"
        
        mvn sonar:sonar \
          -Dsonar.projectKey=sandeepkamathkr_monthlyexpense \
          -Dsonar.organization=sandeepkamathkr \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
          -X
          
        echo "🔍 Checking if SonarCloud report was generated..."
        if [ -f ".scannerwork/report-task.txt" ]; then
          echo "✅ SonarCloud report found"
          cat .scannerwork/report-task.txt
        else
          echo "❌ SonarCloud report not found"
          echo "Contents of .scannerwork directory:"
          ls -la .scannerwork/ || echo "No .scannerwork directory found"
        fi
        
    - name: Check SonarCloud Quality Gate
      if: success()
      uses: SonarSource/sonarqube-quality-gate-action@master
      with:
        scanMetadataReportFile: backend/.scannerwork/report-task.txt
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      timeout-minutes: 5