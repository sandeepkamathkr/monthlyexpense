# Docker profile configuration for PostgreSQL
spring.datasource.url=jdbc:postgresql://db:5432/monthly_expense_db
spring.datasource.username=admin
spring.datasource.password=password123
spring.datasource.driverClassName=org.postgresql.Driver

# JPA Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection pooling
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:80,http://localhost

# CSV Scheduler Configuration
csv.scheduler.enabled=${CSV_SCHEDULER_ENABLED:true}
csv.scheduler.input-folder=${CSV_INPUT_FOLDER:}
csv.scheduler.default-currency=${CSV_DEFAULT_CURRENCY:AUD}
csv.scheduler.interval-ms=${CSV_SCHEDULER_INTERVAL_MS:300000}
reprocess.only=${REPROCESS_ONLY:false}

spring.sql.init.mode=always
